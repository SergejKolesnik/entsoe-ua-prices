[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ukraine-energy-market-forecast"
version = "0.1.0"
description = "Ukrainian day-ahead electricity market data foundation"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
    "xlrd>=2.0,<3",
    "pandas>=2.1,<3",
    "plotly>=5.20,<7",
    "streamlit>=1.42,<2",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
market-forecast = "market_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
