name: Keep Streamlit app awake

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-streamlit-awake
  cancel-in-progress: true

jobs:
  browser-visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install browser runtime
        run: |
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium

      - name: Open, wake, and verify the dashboard
        env:
          STREAMLIT_APP_URL: https://rdn-market-intelligence-ua-v2.streamlit.app/
          STREAMLIT_WAKE_TIMEOUT_SECONDS: "180"
        run: python scripts/wake_streamlit.py
