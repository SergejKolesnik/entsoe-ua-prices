name: Keep Streamlit app awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-streamlit-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep app awake and verify Streamlit health
        run: |
          response="$(curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 10 --connect-timeout 15 --max-time 90 \
            --user-agent "RDN-Market-Intelligence-Keepalive/1.0" \
            https://rdn-market-intelligence-ua-v2.streamlit.app/healthz)"
          test "$response" = '{"status":"ok"}'
