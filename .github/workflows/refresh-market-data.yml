name: Refresh market data

on:
  schedule:
    - cron: "15 14 * * *"
      timezone: "Europe/Kyiv"
    - cron: "0 15,16,17 * * *"
      timezone: "Europe/Kyiv"
    - cron: "20 17 * * *"
      timezone: "Europe/Kyiv"
  workflow_dispatch:
    inputs:
      task:
        description: Data group to refresh
        required: true
        default: all
        type: choice
        options:
          - all
          - operator
          - context
          - diagnose_operator
          - backfill_neighbors
          - backfill_flows
      delivery_date:
        description: Explicit delivery date for read-only diagnostics (YYYY-MM-DD)
        required: false
        type: string
      date_from:
        description: Backfill start date (YYYY-MM-DD; 31 days prices, 14 days flows)
        required: false
        type: string
      date_to:
        description: Backfill end date (YYYY-MM-DD, maximum 31 days per run)
        required: false
        type: string
      market:
        description: Neighboring market to backfill
        required: false
        default: all
        type: choice
        options:
          - all
          - PL
          - SK
          - HU
          - RO

permissions:
  contents: read

concurrency:
  group: market-data-refresh
  cancel-in-progress: false

jobs:
  operator:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'all' || inputs.task == 'operator') ||
      github.event_name == 'schedule' && github.event.schedule != '20 17 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify database configuration
        shell: bash
        run: test -n "$DATABASE_URL"
      - name: Refresh Ukrainian DAM
        shell: bash
        run: |
          set +e
          python -m market_forecast.cli refresh-operator
          status=$?
          if [ "$status" -eq 2 ]; then
            echo "The next delivery day is not published yet."
            exit 0
          fi
          exit "$status"

  context:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.task == 'all' || inputs.task == 'context') ||
      github.event_name == 'schedule' && github.event.schedule == '20 17 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify secret configuration
        shell: bash
        run: test -n "$DATABASE_URL" && test -n "$ENTSOE_TOKEN"
      - name: Refresh neighboring markets and context
        run: python -m market_forecast.cli refresh-context

  diagnose_operator:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.task == 'diagnose_operator'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify read-only diagnostic inputs
        shell: bash
        run: test -n "$DATABASE_URL" && test -n "${{ inputs.delivery_date }}"
      - name: Compare stored and published Operator fields
        run: >-
          python -m market_forecast.cli diagnose-operator-conflict
          --date "${{ inputs.delivery_date }}"

  backfill_neighbors:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'backfill_neighbors'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
      PYTHONPATH: src
      DATE_FROM: ${{ inputs.date_from }}
      DATE_TO: ${{ inputs.date_to }}
      MARKET: ${{ inputs.market }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate bounded backfill inputs
        shell: bash
        run: |
          test -n "$DATABASE_URL" && test -n "$ENTSOE_TOKEN"
          test -n "$DATE_FROM" && test -n "$DATE_TO"
          python - <<'PY'
          import os
          from datetime import date

          date_from = date.fromisoformat(os.environ["DATE_FROM"])
          date_to = date.fromisoformat(os.environ["DATE_TO"])
          days = (date_to - date_from).days + 1
          if days < 1 or days > 31:
              raise SystemExit("Backfill must contain between 1 and 31 inclusive days")
          PY
      - name: Backfill neighboring DAM prices
        run: >-
          python -m market_forecast.cli backfill-neighbors
          --market "$MARKET"
          --from "$DATE_FROM"
          --to "$DATE_TO"
          --delay-seconds 0.75
          --max-days 31

  backfill_flows:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'backfill_flows'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
      PYTHONPATH: src
      DATE_FROM: ${{ inputs.date_from }}
      DATE_TO: ${{ inputs.date_to }}
      MARKET: ${{ inputs.market }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate bounded flow backfill inputs
        shell: bash
        run: |
          test -n "$DATABASE_URL" && test -n "$ENTSOE_TOKEN"
          test -n "$DATE_FROM" && test -n "$DATE_TO"
          python - <<'PY'
          import os
          from datetime import date

          date_from = date.fromisoformat(os.environ["DATE_FROM"])
          date_to = date.fromisoformat(os.environ["DATE_TO"])
          days = (date_to - date_from).days + 1
          if days < 1 or days > 14:
              raise SystemExit("Flow backfill must contain between 1 and 14 inclusive days")
          PY
      - name: Backfill directed physical flows
        run: >-
          python -m market_forecast.cli backfill-flows
          --market "$MARKET"
          --from "$DATE_FROM"
          --to "$DATE_TO"
          --delay-seconds 1.0
          --max-days 14
