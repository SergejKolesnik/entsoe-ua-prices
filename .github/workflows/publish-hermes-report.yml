name: Publish Hermes report JSON

on:
  schedule:
    - cron: "35 17 * * *"
      timezone: "Europe/Kyiv"
  workflow_dispatch:
    inputs:
      delivery_date:
        description: Optional delivery date (YYYY-MM-DD); latest stored day when empty
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: hermes-report-export
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify database configuration
        shell: bash
        run: test -n "$DATABASE_URL"
      - name: Build sanitized JSON
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.delivery_date }}
        run: |
          args=(--output /tmp/hermes-report.json)
          if [ -n "$REQUESTED_DATE" ]; then
            args+=(--date "$REQUESTED_DATE")
          fi
          set +e
          python -m market_forecast.cli export-hermes-report "${args[@]}"
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 2
          python -m json.tool /tmp/hermes-report.json >/dev/null
      - name: Publish latest and versioned files
        shell: bash
        run: |
          delivery_date=$(python -c 'import json; print(json.load(open("/tmp/hermes-report.json"))["delivery_date"])')
          generated_at=$(python -c 'import json; print(json.load(open("/tmp/hermes-report.json"))["generated_at"])')
          version_name=${generated_at//:/-}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin hermes-report >/dev/null 2>&1; then
            git fetch origin hermes-report
            git switch --detach origin/hermes-report
            git switch -c hermes-report
          else
            git switch --orphan hermes-report
            git rm -rf .
          fi
          mkdir -p "v1/$delivery_date"
          cp /tmp/hermes-report.json "v1/$delivery_date/$version_name.json"
          cp /tmp/hermes-report.json latest.json
          git add -- "v1/$delivery_date/$version_name.json" latest.json
          if git diff --cached --quiet; then
            echo "Report is unchanged."
            exit 0
          fi
          git commit -m "data: publish Hermes report $delivery_date"
          git push origin HEAD:hermes-report
